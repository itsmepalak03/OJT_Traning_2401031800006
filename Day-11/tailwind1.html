<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Responsive Navbar</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <!-- Navbar -->
  <nav class="bg-blue-600 shadow-lg">

    <div class="max-w-7xl mx-auto px-4">

      <div class="flex justify-between items-center h-16">

        <!-- Logo -->
        <div class="text-white text-2xl font-bold">
          MyLogo
        </div>

        <!-- Desktop Menu -->
        <div class="hidden md:flex space-x-6">

          <a href="#" class="text-white hover:text-yellow-300 transition">
            Home
          </a>

          <a href="#" class="text-white hover:text-yellow-300 transition">
            About
          </a>

          <a href="#" class="text-white hover:text-yellow-300 transition">
            Services
          </a>

          <a href="#" class="text-white hover:text-yellow-300 transition">
            Contact
          </a>

        </div>

        <!-- Mobile Button -->
        <button id="menu-btn"
          class="md:hidden text-white text-3xl focus:outline-none">
          ☰
        </button>

      </div>

    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu"
      class="hidden md:hidden flex flex-col bg-blue-700 px-4 py-3 space-y-3">

      <a href="#" class="text-white hover:text-yellow-300">
        Home
      </a>

      <a href="#" class="text-white hover:text-yellow-300">
        About
      </a>

      <a href="#" class="text-white hover:text-yellow-300">
        Services
      </a>

      <a href="#" class="text-white hover:text-yellow-300">
        Contact
      </a>

    </div>

  </nav>

  <!-- Hero Section -->
  <section class="flex items-center justify-center h-[90vh]">

    <h1 class="text-4xl md:text-6xl font-bold text-blue-700 text-center">
      Responsive Navigation Bar
    </h1>

  </section>

  <script>

    const menuBtn = document.getElementById("menu-btn");
    const mobileMenu = document.getElementById("mobile-menu");

    menuBtn.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
    });

  </script>

</body>

</html>
