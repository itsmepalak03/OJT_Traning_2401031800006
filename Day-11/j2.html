<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move Div Using jQuery</title>

  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-4.0.0.slim.js"
    integrity="sha256-M+GjhMBfXikM1izMplICCTscIj5hzPCp6uDzaypxtgg="
    crossorigin="anonymous"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    .box {
      width: 250px;
      min-height: 250px;
      background: white;
      border: 2px dashed #3498db;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .item {
      background: #3498db;
      color: white;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    button {
      padding: 12px 20px;
      border: none;
      background: #2ecc71;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      background: #27ae60;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="box" id="box1">
      <h2>Box 1</h2>

      <div class="item" id="moveDiv">
        Move Me
      </div>
    </div>

    <button id="moveBtn">Move →</button>

    <div class="box" id="box2">
      <h2>Box 2</h2>
    </div>

  </div>

  <script>
    $(document).ready(function () {

      $("#moveBtn").click(function () {

        $("#moveDiv").appendTo("#box2");

      });

    });
  </script>

</body>

</html>
